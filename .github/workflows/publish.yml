# Publishes this package to npm as @jetserge/pi-usage-bars.
#
# The first version must be published manually. After that, npm trusted
# publishing authenticates this workflow through GitHub OIDC.
name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate and pack the tarball, but do not publish"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'CrazyCoder/pi-usage-bars'
    name: verify and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PKG: "@jetserge/pi-usage-bars"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Upgrade npm
        run: npm install -g npm@11 && npm --version

      - run: npm ci

      - name: Run checks
        run: npm run check

      - name: Guard the release commit
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "${{ github.event_name }}" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi
          if ! git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null; then
            echo "::error::no tag ${TAG} exists"
            exit 1
          fi
          TAG_SHA="$(git rev-list -n1 "$TAG")"
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::${TAG} points at ${TAG_SHA}, not ${GITHUB_SHA}"
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on origin/main"
            exit 1
          fi

      - name: Verify the tarball is loadable
        run: npm run verify:tarball

      - name: Check whether this version is already published
        id: published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG}@${VERSION}" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG}@${VERSION} is already published"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.already == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        run: npm publish --access public

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          fi

      - name: Summary
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### ${PKG}@${VERSION}"
            echo ""
            if [ "${{ steps.published.outputs.already }}" = "true" ]; then
              echo "Already on npm. Every gate still ran."
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run complete. Nothing was published."
            else
              echo "Published through npm trusted publishing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
